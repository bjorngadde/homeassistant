name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Leak check and render snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The optional repository secret SCRUB_DENYLIST_TERMS holds the private denylist (one term per line,
      # see CLAUDE.md). --quiet keeps every term out of the log: it prints only file:line.
      - name: Leak check
        env:
          TERMS: ${{ secrets.SCRUB_DENYLIST_TERMS }}
        run: |
          if [ -n "$TERMS" ]; then
            printf '%s\n' "$TERMS" > "$RUNNER_TEMP/denylist.txt"
            export SCRUB_DENYLIST="$RUNNER_TEMP/denylist.txt"
          fi
          node scripts/scrub-check.mjs --quiet
      - name: Render snapshots
        run: npm test

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          comment: false
          # brands, description, images and topics only matter for the HACS default store, not a custom repository.
          # license: the repository has no LICENSE file yet; drop it from this list once one is added.
          ignore: brands description images license topics
