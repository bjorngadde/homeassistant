name: Release

# Publishes a release with dist/house-cards.js attached; HACS installs the cards from the latest release.
# Two ways to start it (see .claude/skills/release/SKILL.md):
#   - push a tag vX.Y.Z that matches "version" in package.json, or
#   - run it by hand on main ("Run workflow", or the API): it creates the tag v<package.json version> itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Decide the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::run the release on main (got $GITHUB_REF)"
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$want" >/dev/null 2>&1; then
              echo "::error::$want already exists: bump version in package.json first"
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($want)"
            exit 1
          fi
          echo "TAG=$want" >> "$GITHUB_ENV"
      - name: Leak check
        env:
          TERMS: ${{ secrets.SCRUB_DENYLIST_TERMS }}
        run: |
          if [ -n "$TERMS" ]; then
            printf '%s\n' "$TERMS" > "$RUNNER_TEMP/denylist.txt"
            export SCRUB_DENYLIST="$RUNNER_TEMP/denylist.txt"
          fi
          node scripts/scrub-check.mjs --quiet
      - name: Lint, types, render snapshots (builds dist/)
        run: npm run lint && npm run typecheck && npm test
      - name: Publish the release (creates the tag on this commit if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/house-cards.js dist/house-cards.js.map --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  hacs:
    name: HACS validation
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          comment: false
          ignore: brands description images topics
